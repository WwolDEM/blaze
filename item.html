  <script>

  <style>
/* =========================================================
   blaze — дизайн-система
   ========================================================= */

:root {
  /* Цвета бренда */
  --bark: #5E4A38;   /* кора — основной тёмный фон */
  --mark: #D8452B;   /* метка — только акцент */
  --birch: #F4EFE6;  /* берёста — светлый фон */
  --coal: #2B2B2B;   /* уголь — текст */
  --white: #FFFFFF;  /* карточки на светлом фоне */

  /* Роли, которые не меняются ночью */
  --paper: #F4EFE6;     /* светлый текст на тёмном фоне */
  --on-mark: #FFFFFF;   /* текст на красной кнопке */
  --coal-bg: #2B2B2B;   /* тёмные плашки: подвал, тост, подсказки */
  --label: var(--bark); /* мелкие подписи на светлом фоне */
  --pack-fill: var(--bark);

  --mark-hover: #BC3920;
  --placeholder: #9C9892;
  --line-dark: rgba(43, 43, 43, 0.14);
  --line-light: rgba(244, 239, 230, 0.22);

  --font: "Montserrat", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;

  /* Сетка */
  --container: 1280px;
  --gutter: 80px;
  --col-gap: 24px;

  --radius: 8px;
  --header-h: 80px;
  --section-pad: 128px;
  --dur: 250ms;
}

/* Ночной режим «у костра» */
:root[data-mode="night"] {
  --birch: #1E1A17;
  --white: #1E1A17;
  --bark: #14110F;
  --coal: #F4EFE6;      /* основной текст */
  --mark: #E8663A;
  --mark-hover: #F07A50;
  --coal-bg: #14110F;
  --label: #C4B39E;
  --pack-fill: #8A7258;
  --placeholder: #3A332D;
  --line-dark: rgba(244, 239, 230, 0.16);
  color-scheme: dark;
}

/* плавная смена цветов только в момент переключения */
.mode-anim,
.mode-anim *,
.mode-anim *::before,
.mode-anim *::after {
  transition: background-color 400ms ease, color 400ms ease, border-color 400ms ease,
    fill 400ms ease, stroke 400ms ease, opacity 400ms ease !important;
}

@media (max-width: 1024px) {
  :root { --gutter: 40px; --section-pad: 96px; }
}

@media (max-width: 640px) {
  :root { --gutter: 20px; --col-gap: 16px; --section-pad: 72px; --header-h: 64px; }
}

/* =========================================================
   База
   ========================================================= */

*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: var(--header-h);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: var(--font);
  font-size: 18px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--coal);
  background: var(--birch);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5 {
  margin: 0;
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.01em;
  text-transform: lowercase;
}

p, ul, ol, figure, address { margin: 0; }
address { font-style: normal; }
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 3px solid var(--mark);
  outline-offset: 3px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: 16px;
  top: -100px;
  z-index: 200;
  padding: 12px 16px;
  border-radius: var(--radius);
  background: var(--coal-bg);
  color: var(--paper);
  font-weight: 600;
  text-decoration: none;
}
.skip-link:focus { top: 16px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
  }
}

/* =========================================================
   Сетка и секции
   ========================================================= */

.container {
  width: 100%;
  max-width: var(--container);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  column-gap: var(--col-gap);
}

.section { padding-block: var(--section-pad); }

.section--bark {
  background: var(--bark);
  color: var(--paper);
  --mark-side: var(--paper);
  --mark-cut: var(--bark);
}

.section--birch {
  background: var(--birch);
  color: var(--coal);
  --mark-side: var(--coal);
  --mark-cut: var(--birch);
}

.section--white {
  background: var(--white);
  color: var(--coal);
  --mark-side: var(--coal);
  --mark-cut: var(--white);
}

.section-head {
  align-items: end;
  row-gap: 20px;
  margin-bottom: 64px;
}
.section-title {
  grid-column: 1 / span 7;
  font-size: clamp(36px, 5vw, 64px);
}
.section-lead {
  grid-column: 8 / -1;
  max-width: 36ch;
}

.eyebrow {
  color: var(--mark);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

@media (max-width: 900px) {
  .section-title, .section-lead { grid-column: 1 / -1; }
  .section-head { margin-bottom: 48px; }
}

/* =========================================================
   Кнопки
   ========================================================= */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  min-height: 56px;
  padding: 0 28px;
  border: 2px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: inherit;
  font: 600 18px/1.2 var(--font);
  text-decoration: none;
  cursor: pointer;
  transition: background-color var(--dur), color var(--dur), border-color var(--dur), opacity var(--dur);
}

.btn--lg { min-height: 64px; padding-inline: 32px; }

.btn--primary {
  background: var(--mark);
  border-color: var(--mark);
  color: var(--on-mark);
  --mark-color: var(--on-mark);
}
.btn--primary:hover { background: var(--mark-hover); border-color: var(--mark-hover); }

.btn--outline {
  border-color: currentColor;
}
.btn--outline:hover {
  background: var(--coal);
  border-color: var(--coal);
  color: var(--birch);
}

.btn--ghost {
  padding-inline: 12px;
  margin-left: -12px;
  --mark-color: var(--coal);
}
.btn--ghost:hover { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }

.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.btn .mark { --mark-h: 30px; }

.link-btn {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  padding: 0 4px;
  border: 0;
  background: none;
  color: inherit;
  font: 600 18px/1.2 var(--font);
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 6px;
  cursor: pointer;
}
.link-btn:hover { color: var(--mark); }

/* =========================================================
   Метки — фирменный модуль (64 × 300, как буква l)
   Размер задаётся через --mark-h, цвета через --mark-color / --mark-side / --mark-cut
   ========================================================= */

.mark {
  --h: var(--mark-h, 300px);
  --w: calc(var(--h) * 64 / 300);
  --gap: calc(var(--w) / 4);
  --color: var(--mark-color, var(--mark));
  --side: var(--mark-side, var(--paper));
  --cut: var(--mark-cut, var(--bark));
  position: relative;
  display: inline-block;
  flex: none;
  height: var(--h);
  vertical-align: middle;
}

/* прямо — одна красная полоса */
.mark-straight {
  width: var(--w);
  background: var(--color);
}

/* старт — светлая / красная / светлая (на светлом фоне — уголь / красная / уголь) */
.mark-start {
  width: calc(var(--w) * 3 + var(--gap) * 2);
  padding-inline: calc(var(--w) + var(--gap));
  background: var(--color);
  background-clip: content-box;
}
.mark-start::before,
.mark-start::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: var(--w);
  background: var(--side);
}
.mark-start::before { left: 0; }
.mark-start::after { right: 0; }

/* направо / налево — две короткие полосы, верхняя смещена */
.mark-right,
.mark-left {
  width: calc(var(--w) * 1.7);
}
.mark-right::before, .mark-right::after,
.mark-left::before, .mark-left::after {
  content: "";
  position: absolute;
  width: var(--w);
  height: calc(50% - var(--h) * 0.034);
  background: var(--color);
}
.mark-right::before { top: 0; right: 0; }
.mark-right::after { bottom: 0; left: 0; }
.mark-left::before { top: 0; left: 0; }
.mark-left::after { bottom: 0; right: 0; }

/* финиш — метка «старт», перечёркнутая диагональю */
.mark__slash {
  position: absolute;
  z-index: 1;
  left: 50%;
  top: 50%;
  width: calc(var(--w) * 0.9);
  height: calc(var(--h) * 1.38);
  background: var(--side);
  border-inline: calc(var(--w) * 0.26) solid var(--cut);
  transform: translate(-50%, -50%) rotate(37deg);
}

/* Полосы отдельными элементами — их добавляет script.js,
   чтобы каждая полоса «рисовалась» краской по очереди */
.mark.is-hydrated { background: none; }
.mark.is-hydrated::before,
.mark.is-hydrated::after { content: none; }

.mark__bar {
  position: absolute;
  width: var(--w);
  background: var(--color);
  filter: url(#paint); /* неровный край «краски по коре» */
}
.mark-start .mark__bar,
.mark-straight .mark__bar { top: 0; bottom: 0; }
.mark__bar--s1 { left: 0; background: var(--side); }
.mark__bar--s2 { right: 0; background: var(--side); }
.mark-start .mark__bar--m { left: calc(var(--w) + var(--gap)); }
.mark-straight .mark__bar--m { left: 0; }
.mark-right .mark__bar,
.mark-left .mark__bar { height: calc(50% - var(--h) * 0.034); }
.mark-right .mark__bar--t { top: 0; right: 0; }
.mark-right .mark__bar--b { bottom: 0; left: 0; }
.mark-left .mark__bar--t { top: 0; left: 0; }
.mark-left .mark__bar--b { bottom: 0; right: 0; }

/* в маленьких метках-иконках неровный край заметен — без фильтра */
.btn .mark__bar,
.toast .mark__bar { filter: none; }

.paint-filter { position: absolute; width: 0; height: 0; }

/* Проявление снизу вверх, как мазок кисти */
.paint-ready .mark:not(.is-hydrated) { visibility: hidden; }
.paint-ready .mark__bar,
.paint-ready .mark__slash {
  clip-path: inset(calc(100% + 4px) -4px -4px -4px);
  transition: clip-path 600ms cubic-bezier(0.6, 0, 0.2, 1);
  transition-delay: calc(var(--i, 0) * 80ms);
}
.paint-ready .mark.is-painted .mark__bar,
.paint-ready .mark.is-painted .mark__slash { clip-path: inset(-4px); }

/* =========================================================
   Шапка
   ========================================================= */

.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--birch);
  border-bottom: 1px solid var(--line-dark);
}

.header__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: var(--header-h);
}

.header__logo {
  display: inline-flex;
  padding-block: 6px;
}
.header__logo img { width: auto; height: 36px; }

.nav { margin-left: auto; }

.nav__list {
  display: flex;
  gap: 40px;
  padding: 0;
  list-style: none;
}

.nav__link {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  text-decoration-thickness: 2px;
  text-underline-offset: 6px;
}
.nav__link:hover { text-decoration-line: underline; }
.nav__link--accent { color: var(--mark); }

.cart-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  margin-left: 40px;
  padding: 0 4px;
  border: 0;
  background: none;
  color: inherit;
  font: 600 16px/1 var(--font);
  cursor: pointer;
}
.cart-btn:hover .cart-btn__label {
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 6px;
}
.cart-btn__count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 6px;
  background: var(--coal);
  color: var(--birch);
  font-size: 13px;
  font-weight: 700;
  transition: background-color var(--dur);
}
.cart-btn__count.has-items { background: var(--mark); color: var(--on-mark); }

/* логотип: днём тёмные буквы, ночью светлые */
.logo-night { display: none; }
:root[data-mode="night"] .logo-day { display: none; }
:root[data-mode="night"] .logo-night { display: block; }

/* переключатель «день / ночь» */
.mode-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 48px;
  margin-left: 28px;
  padding: 0 4px;
  border: 0;
  background: none;
  color: inherit;
  font: 600 15px/1 var(--font);
  cursor: pointer;
}
.mode-btn__day,
.mode-btn__night {
  padding-block: 4px;
  border-bottom: 2px solid transparent;
  color: var(--label);
}
.mode-btn__sep { color: var(--label); }
.mode-btn[aria-pressed="false"] .mode-btn__day,
.mode-btn[aria-pressed="true"] .mode-btn__night {
  color: var(--coal);
  border-bottom-color: var(--mark);
}

.burger {
  display: none;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  margin-right: -12px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--coal);
  cursor: pointer;
}
.burger__lines,
.burger__lines::before,
.burger__lines::after {
  display: block;
  width: 24px;
  height: 2px;
  background: currentColor;
  transition: transform var(--dur), background-color var(--dur);
}
.burger__lines { position: relative; }
.burger__lines::before,
.burger__lines::after {
  content: "";
  position: absolute;
  left: 0;
}
.burger__lines::before { top: -8px; }
.burger__lines::after { top: 8px; }
.burger[aria-expanded="true"] .burger__lines { background: transparent; }
.burger[aria-expanded="true"] .burger__lines::before { transform: translateY(8px) rotate(45deg); }
.burger[aria-expanded="true"] .burger__lines::after { transform: translateY(-8px) rotate(-45deg); }

@media (max-width: 768px) {
  .header__logo img { height: 30px; }
  .burger { display: inline-flex; }
  .cart-btn { margin-left: auto; }
  .mode-btn { margin-left: 12px; margin-right: 4px; font-size: 14px; }

  .nav {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    padding: 8px var(--gutter) 24px;
    background: var(--birch);
    border-bottom: 1px solid var(--line-dark);
  }
  .menu-open .nav { display: block; }

  .nav__list { flex-direction: column; gap: 0; }
  .nav__link { width: 100%; min-height: 56px; font-size: 22px; }
}

/* на узком телефоне у корзины остаётся только счётчик (подпись — для скринридера) */
@media (max-width: 420px) {
  .cart-btn__label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .mode-btn { margin-left: 8px; gap: 4px; }
}

/* =========================================================
   Первый экран
   ========================================================= */

/* Экран пополам: слева текст на коре, справа фото до края окна.
   Шов между ними закрывает красная метка. */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  min-height: clamp(560px, calc(100vh - var(--header-h)), 880px);
  min-height: clamp(560px, calc(100svh - var(--header-h)), 880px);
}

.hero__text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  padding-block: 96px;
  /* левый край текста совпадает с контейнером остальных секций */
  padding-left: max(var(--gutter), calc((100vw - var(--container)) / 2 + var(--gutter)));
  padding-right: clamp(40px, 5vw, 88px);
}

.hero__eyebrow {
  margin-bottom: 28px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.hero__title { font-size: clamp(40px, 5.2vw, 80px); }

.hero__lead {
  max-width: 30ch;
  margin-top: 28px;
  font-size: 20px;
}

.hero__cta { margin-top: 44px; }

.hero__photo {
  position: relative;
  background: var(--placeholder);
}
.hero__photo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 40% 50%; /* палатка и озеро в кадре, ствол с краю срезан */
}

.hero__seam {
  position: absolute;
  z-index: 1;
  top: 0;
  bottom: 0;
  left: 0;
  width: clamp(14px, 1.6vw, 24px);
  background: var(--mark);
  transform: translateX(-50%);
}

@media (max-width: 768px) {
  .hero {
    grid-template-columns: minmax(0, 1fr);
    min-height: 0;
  }
  .hero__photo {
    grid-row: 1;
    aspect-ratio: 4 / 3;
  }
  /* на телефоне метка стоит на стыке фото и текста, как бирка */
  .hero__seam {
    top: auto;
    bottom: -32px;
    left: var(--gutter);
    width: 14px;
    height: 64px;
    transform: none;
  }
  .hero__text {
    padding: 72px var(--gutter) var(--section-pad);
  }
  .hero__eyebrow { margin-bottom: 20px; font-size: 13px; }
  .hero__lead { font-size: 18px; }
  .hero__cta { margin-top: 36px; }
}

/* =========================================================
   Конструктор похода
   ========================================================= */

.builder {
  padding-top: 40px;
  border-top: 2px solid var(--coal);
}

.builder__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.progress {
  display: flex;
  gap: 8px;
}
.progress__seg {
  width: 10px;
  height: 46px;
  border: 2px solid var(--coal);
  transition: background-color var(--dur), border-color var(--dur);
}
.progress__seg.is-done {
  background: var(--mark);
  border-color: var(--mark);
}

.builder__stage {
  margin-top: 32px;
  transition: opacity var(--dur) ease, transform var(--dur) ease;
}
.builder__stage.is-out { opacity: 0; transform: translateX(-24px); }
.builder__stage.is-out[data-dir="back"] { transform: translateX(24px); }
.builder__stage.is-in { opacity: 0; transform: translateX(24px); transition: none; }
.builder__stage.is-in[data-dir="back"] { transform: translateX(-24px); }

/* Вопрос */
.q__fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.q__title {
  float: left;
  width: 100%;
  margin-bottom: 40px;
  padding: 0;
  font-size: clamp(32px, 4.4vw, 56px);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.01em;
  text-transform: lowercase;
}
.q__title:focus { outline: none; }

.options {
  clear: both;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

.option { position: relative; display: block; }

.option__input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  margin: 0;
}

.option__tile {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 88px;
  padding: 16px;
  border: 2px solid var(--coal);
  border-radius: var(--radius);
  background: var(--white);
  color: var(--coal);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  cursor: pointer;
  transition: background-color var(--dur), color var(--dur), border-color var(--dur);
}
.option__tile:hover { border-color: var(--mark); }

.option__input:checked + .option__tile {
  background: var(--coal);
  border-color: var(--coal);
  color: var(--birch);
}
.option__input:focus-visible + .option__tile {
  outline: 3px solid var(--mark);
  outline-offset: 3px;
}

.builder__nav {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 48px;
}
.btn--next {
  margin-left: auto;
  min-width: 180px;
  justify-content: space-between;
}

@media (max-width: 768px) {
  .options { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .option:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .option__tile { min-height: 72px; font-size: 18px; }
  .q__title { margin-bottom: 28px; }
  .builder__nav { margin-top: 36px; }
  .btn--next { min-width: 0; }
}

/* Результат */
.result__head {
  display: flex;
  align-items: center;
  gap: 48px;
  --mark-h: 132px;
}
.result__head .mark { margin-inline: 8px; }

.result__title {
  font-size: clamp(32px, 4.4vw, 56px);
}
.result__title:focus { outline: none; }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
  padding: 0;
  list-style: none;
}
.chip {
  padding: 6px 12px;
  border: 1.5px solid var(--coal);
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.2;
}

.result__block { margin-top: 72px; }

.block-title {
  margin-bottom: 24px;
  font-size: 32px;
}

.layers {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--col-gap);
  padding: 0;
  list-style: none;
}

.layer {
  padding: 32px;
  border-radius: var(--radius);
  background: var(--white);
}
.layer__num {
  color: var(--label);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.16em;
}
.layer__title {
  margin: 12px 0 20px;
  font-size: 26px;
}

.bullets {
  display: grid;
  gap: 10px;
  padding: 0;
  list-style: none;
}
/* маркер — абсолютный, чтобы термины словаря внутри пункта шли обычным текстом */
.bullets li {
  position: relative;
  padding-left: 19px;
}
.bullets li::before {
  content: "";
  position: absolute;
  top: calc(0.75em - 9px);
  left: 0;
  width: 5px;
  height: 18px;
  background: var(--mark);
}

.guide {
  margin-top: var(--col-gap);
  padding: 32px;
  border: 2px solid var(--coal);
  border-radius: var(--radius);
}
.guide__title { font-size: 24px; }
.guide__list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--col-gap);
  margin-top: 20px;
  padding: 0;
  list-style: none;
}
.guide__list b { font-weight: 700; }

.gear {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--col-gap);
}
.gear__group {
  padding-top: 20px;
  border-top: 2px solid var(--coal);
}
.gear__title {
  margin-bottom: 16px;
  font-size: 20px;
}

.tip {
  display: flex;
  gap: 28px;
}
.tip::before {
  content: "";
  flex: none;
  width: 8px;
  background: var(--mark);
}
.tip__label {
  color: var(--label);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.tip__text {
  max-width: 34ch;
  margin-top: 12px;
  font-size: clamp(20px, 2.2vw, 26px);
  font-weight: 600;
  line-height: 1.3;
}

.result__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px 24px;
  margin-top: 72px;
  padding-top: 40px;
  border-top: 2px solid var(--coal);
}

@media (max-width: 900px) {
  .layers, .gear, .guide__list { grid-template-columns: 1fr; }
  .gear { row-gap: 32px; }
}

@media (max-width: 640px) {
  .result__head { flex-direction: column; align-items: flex-start; gap: 32px; --mark-h: 96px; }
  .result__block { margin-top: 56px; }
  .layer, .guide { padding: 24px; }
  .tip { gap: 20px; }
  .result__actions .btn { width: 100%; }
}

/* =========================================================
   О бренде
   ========================================================= */

.about { align-items: center; }

.about__photo {
  grid-column: 1 / span 7;
  aspect-ratio: 3 / 2;
  background: var(--placeholder);
}
.about__photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.about__text { grid-column: 9 / -1; }
.about__text .section-title { font-size: clamp(36px, 5vw, 64px); }
.about__body { margin-top: 32px; max-width: 34ch; }

.trail {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 24px;
  margin-top: 112px;
  padding: 0;
  list-style: none;
  --mark-h: 160px;
}

.trail__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.trail__mark {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  height: var(--mark-h);
  margin-bottom: 28px;
}

.trail__title { font-size: 18px; }
.trail__text { margin-top: 8px; font-size: 14px; line-height: 1.4; }

@media (max-width: 900px) {
  .about__photo, .about__text { grid-column: 1 / -1; }
  .about__text { max-width: 640px; margin-top: 48px; }
  .trail { margin-top: 80px; --mark-h: 140px; }
}

@media (max-width: 640px) {
  .trail {
    margin-top: 64px;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    row-gap: 48px;
    --mark-h: 110px;
  }
}

/* =========================================================
   Каталог
   ========================================================= */

.products {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 56px var(--col-gap);
  padding: 0;
  list-style: none;
}

.product {
  grid-column: span 4;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.product__link {
  display: block;
  width: 100%;
  color: inherit;
  text-decoration: none;
}
.product__link:hover .product__name {
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}
.product__link:focus-visible { outline-offset: 6px; }

.product__desc {
  margin: 8px 0 14px;
  font-size: 15px;
  line-height: 1.45;
}

.product__photo {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  aspect-ratio: 4 / 5;
  padding: 20px;
  border-radius: var(--radius);
  background: var(--birch);
  color: var(--label);
  font-size: 14px;
  font-weight: 600;
}

.product__photo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product__name {
  margin-top: 20px;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: 0;
  text-transform: none;
}

.product__price {
  margin-top: auto; /* цена и кнопка — по нижнему краю карточек в ряду */
  font-size: 20px;
  font-weight: 700;
}

.product__add {
  min-height: 48px;
  margin-top: 16px;
  padding-inline: 20px;
  font-size: 16px;
}

@media (max-width: 900px) {
  .product { grid-column: span 6; }
}
@media (max-width: 560px) {
  .product { grid-column: 1 / -1; }
}

/* =========================================================
   Подвал
   ========================================================= */

.footer {
  padding-block: 88px 40px;
  background: var(--coal-bg);
  color: var(--paper);
}

.footer__top { row-gap: 48px; }

.footer__brand { grid-column: 1 / span 5; }
.footer__brand img { width: auto; height: 40px; }
.footer__brand p { margin-top: 20px; max-width: 26ch; }

.footer__col { grid-column: span 3; }
.footer__top > :nth-child(2) { grid-column: 7 / span 3; }

.footer__title {
  margin-bottom: 16px;
  font-size: 14px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.footer__list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0;
  list-style: none;
}
.footer__list a {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  text-decoration: none;
  text-decoration-thickness: 2px;
  text-underline-offset: 6px;
}
.footer__list a:hover { text-decoration-line: underline; }
.footer__list span { padding-block: 8px; }

.footer__copy {
  margin-top: 72px;
  padding-top: 24px;
  border-top: 1px solid var(--line-light);
  font-size: 14px;
}

@media (max-width: 900px) {
  .footer__brand { grid-column: 1 / -1; }
  .footer__top > .footer__col { grid-column: span 6; }
}
@media (max-width: 560px) {
  .footer__top > .footer__col { grid-column: 1 / -1; }
}

/* =========================================================
   Корзина
   ========================================================= */

body.cart-open { overflow: hidden; }

.cart-overlay {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(43, 43, 43, 0.5);
  opacity: 0;
  transition: opacity var(--dur);
}
.cart-open .cart-overlay { opacity: 1; }

.cart {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 95;
  display: flex;
  flex-direction: column;
  width: min(460px, 100%);
  background: var(--birch);
  color: var(--coal);
  transform: translateX(100%);
  transition: transform var(--dur) ease;
  --mark-side: var(--coal);
  --mark-cut: var(--birch);
}
.cart-open .cart { transform: none; }

.cart__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 32px;
  border-bottom: 2px solid var(--coal);
}
.cart__title { font-size: 32px; }
.cart__title:focus { outline: none; }

.cart__close {
  position: relative;
  width: 48px;
  height: 48px;
  margin-right: -12px;
  border: 0;
  background: none;
  color: var(--coal);
  cursor: pointer;
}
.cart__close span::before,
.cart__close span::after {
  content: "";
  position: absolute;
  left: 12px;
  top: 23px;
  width: 24px;
  height: 2px;
  background: currentColor;
}
.cart__close span::before { transform: rotate(45deg); }
.cart__close span::after { transform: rotate(-45deg); }

.cart__body {
  flex: 1;
  overflow-y: auto;
  padding: 0 32px 32px;
}

.cart__foot {
  display: grid;
  gap: 12px;
  padding: 24px 32px 32px;
  border-top: 2px solid var(--coal);
}

.cart-list { padding: 0; list-style: none; }

.cart-item {
  padding: 24px 0 12px;
  border-bottom: 1px solid var(--line-dark);
}
.cart-item__type {
  color: var(--label);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.cart-item__name {
  margin-top: 6px;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: 0;
  text-transform: none;
}
.cart-item__details { margin-top: 4px; }
.cart-item__details summary {
  display: flex;
  align-items: center;
  min-height: 48px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.cart-item__details summary::-webkit-details-marker { display: none; }
.cart-item__details summary::after {
  content: "+";
  margin-left: 10px;
  color: var(--mark);
  font-size: 20px;
}
.cart-item__details[open] summary::after { content: "−"; }
.cart-item__details .bullets { padding-bottom: 8px; font-size: 16px; }
.cart-item__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 12px;
}
.cart-item__price { font-size: 18px; font-weight: 700; }
.cart-item__remove { font-size: 15px; }

.qty {
  display: inline-flex;
  align-items: center;
  border: 2px solid var(--coal);
  border-radius: var(--radius);
}
.qty__btn {
  width: 48px;
  height: 48px;
  border: 0;
  background: none;
  color: var(--coal);
  font: 600 22px/1 var(--font);
  cursor: pointer;
}
.qty__btn:hover { color: var(--mark); }
.qty__value { min-width: 28px; font-weight: 600; text-align: center; }

.cart-total {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  font-weight: 700;
}
.cart-note { font-size: 14px; line-height: 1.4; }
.cart-clear { justify-self: center; font-size: 15px; }

.cart-empty {
  display: grid;
  justify-items: start;
  gap: 16px;
  padding-top: 48px;
  --mark-h: 80px;
}
.cart-empty__title { font-size: 24px; font-weight: 700; line-height: 1.1; }

@media (max-width: 640px) {
  .cart__head { padding: 12px 20px; }
  .cart__body { padding: 0 20px 24px; }
  .cart__foot { padding: 20px 20px 24px; }
}

/* =========================================================
   Собери рюкзак
   ========================================================= */

.pack {
  row-gap: 40px;
  align-items: start;
}

.pack__shelf {
  grid-column: 1 / span 7;
  margin: -16px;
  padding: 16px;
  border: 2px dashed transparent;
  border-radius: var(--radius);
}

.pack__panel {
  grid-column: 8 / -1;
  padding: 32px;
  border: 2px dashed transparent;
  border-radius: var(--radius);
  background: var(--birch);
  transition: border-color var(--dur);
}

[data-drop].is-drop-target { border-color: var(--mark); }

.pack__subtitle {
  margin-bottom: 16px;
  padding: 0;
  font-size: 20px;
  font-weight: 700;
  line-height: 1.05;
  text-transform: lowercase;
}
.pack__subtitle:focus { outline: none; }

.pack__items {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 0;
  list-style: none;
}
.pack__items--packed {
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
}

.pack-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 10px 10px 18px;
  border: 2px solid var(--coal);
  border-radius: var(--radius);
  background: var(--white);
  cursor: grab;
}
.pack-item--packed { border-color: transparent; }
.pack-item.is-dragging { opacity: 0.4; }

.pack-item__name { font-weight: 600; line-height: 1.25; }
.pack-item__qty { color: var(--mark); white-space: nowrap; }
.pack-item__meta { margin-top: 2px; color: var(--label); font-size: 14px; line-height: 1.3; }

.pack-item__btn {
  flex: none;
  width: 48px;
  height: 48px;
  border: 2px solid var(--coal);
  border-radius: var(--radius);
  background: none;
  color: var(--coal);
  font: 600 24px/1 var(--font);
  cursor: pointer;
  transition: background-color var(--dur), color var(--dur);
}
.pack-item__btn:hover { background: var(--coal); color: var(--birch); }

.pack__volume {
  min-width: 0;
  margin: 0 0 28px;
  padding: 0;
  border: 0;
}

.segmented { display: flex; gap: 8px; }
.segmented__item { position: relative; flex: 1; }
.segmented__item input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
}
.segmented__item span {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  border: 2px solid var(--coal);
  border-radius: var(--radius);
  background: var(--white);
  font-weight: 600;
  cursor: pointer;
  transition: background-color var(--dur), color var(--dur);
}
.segmented__item input:checked + span {
  background: var(--coal);
  color: var(--birch);
}
.segmented__item input:focus-visible + span {
  outline: 3px solid var(--mark);
  outline-offset: 3px;
}

.pack__status {
  display: flex;
  align-items: center;
  gap: 28px;
  margin-bottom: 32px;
}

.pack__svg { flex: none; width: 128px; height: auto; }

.pack__fill {
  fill: var(--pack-fill);
  transform-box: fill-box;
  transform-origin: 50% 100%;
  transform: scaleY(var(--f, 0));
  transition: transform 400ms cubic-bezier(0.6, 0, 0.2, 1), fill var(--dur);
}
.pack__panel.is-over .pack__fill { fill: var(--mark); }

.pack__line {
  fill: none;
  stroke: var(--coal);
  stroke-width: 3;
}

.pack__stats { display: grid; gap: 6px; }
.pack__stat { display: flex; align-items: baseline; gap: 8px; }
.pack__num {
  font-size: clamp(36px, 4vw, 48px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.02em;
}
.pack__unit { font-weight: 600; }

.pack__hint {
  margin-top: 14px;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.4;
}
.pack__hint.is-alert { color: var(--mark); font-weight: 600; }

.pack__empty { color: var(--label); font-size: 15px; }

.pack__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 20px;
  margin-top: 28px;
  padding-top: 24px;
  border-top: 2px solid var(--coal);
}

@media (max-width: 1024px) {
  .pack__shelf,
  .pack__panel { grid-column: 1 / -1; }
  .pack__panel { order: -1; }
}

@media (max-width: 560px) {
  .pack__items { grid-template-columns: minmax(0, 1fr); }
  .pack__panel { padding: 24px 20px; }
  .pack__status { gap: 20px; }
  .pack__svg { width: 92px; }
}

/* =========================================================
   Паспорт вещи (item.html)
   ========================================================= */

.item-hero__grid { align-items: center; row-gap: 40px; }

.item-hero__photo {
  grid-column: 1 / span 6;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-radius: var(--radius);
  background: var(--birch);
}
.item-hero__photo img { width: 100%; height: 100%; object-fit: cover; }

.item-hero__info { grid-column: 8 / -1; }

.item-hero__label {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
  --mark-h: 56px;
}

.item-hero__title {
  font-size: clamp(32px, 4vw, 52px);
  line-height: 1.1;
  text-transform: none;
}
.item-hero__price { margin-top: 16px; font-size: 26px; font-weight: 700; }
.item-hero__short { max-width: 40ch; margin-top: 20px; }
.item-hero__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px 28px;
  margin-top: 36px;
}
.item-hero__actions .btn--ghost { margin-left: 0; }

.passport {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--col-gap);
}
.passport__block {
  padding: 32px;
  border-radius: var(--radius);
  background: var(--white);
}
.passport__num {
  color: var(--label);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.16em;
}
.passport__title { margin: 12px 0 20px; font-size: 26px; }
.passport__seasons { margin-top: 16px; color: var(--label); font-size: 15px; }

.route-tiles { display: grid; gap: 10px; padding: 0; list-style: none; }
.route-tile {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 56px;
  padding: 10px 18px;
  border: 2px solid var(--coal);
  border-radius: var(--radius);
  font-weight: 600;
  text-decoration: none;
  transition: background-color var(--dur), color var(--dur);
}
.route-tile__name { font-size: 20px; }
.route-tile__cta { color: var(--mark); font-size: 14px; }
.route-tile:hover { background: var(--coal); color: var(--birch); }
.route-tile:hover .route-tile__cta { color: inherit; }

.journey-grid { align-items: center; row-gap: 48px; }
.journey { grid-column: 1 / span 7; }
.journey__title { margin-top: 16px; font-size: clamp(28px, 3.6vw, 44px); }
.journey__form {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin-top: 32px;
}
.journey__field { display: grid; gap: 6px; }
.journey__label {
  color: var(--label);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.journey__input {
  width: 140px;
  min-height: 56px;
  padding: 0 16px;
  border: 2px solid var(--coal);
  border-radius: var(--radius);
  background: var(--white);
  color: var(--coal);
  font: 600 20px/1 var(--font);
}
.journey__input[aria-invalid="true"] { border-color: var(--mark); }
.journey__error {
  min-height: 1.5em;
  margin-top: 10px;
  color: var(--mark);
  font-size: 15px;
  font-weight: 600;
}
.journey__reset { font-size: 15px; }

/* QR всегда на белом — так его прочитает любая камера */
.qr {
  grid-column: 9 / -1;
  justify-self: end;
  display: grid;
  justify-items: center;
  gap: 12px;
  padding: 24px;
  border-radius: var(--radius);
  background: #FFFFFF;
  color: #2B2B2B;
}
.qr__code img,
.qr__code canvas { display: block; width: 168px; height: 168px; }
.qr__caption { font-size: 14px; font-weight: 600; }

.lost__inner {
  display: grid;
  align-content: center;
  justify-items: start;
  gap: 24px;
  min-height: 50vh;
  --mark-h: 160px;
}
.lost__title { font-size: clamp(40px, 6vw, 80px); }
.lost__text { max-width: 40ch; }

@media (max-width: 900px) {
  .item-hero__photo,
  .item-hero__info,
  .journey,
  .qr { grid-column: 1 / -1; }
  .qr { justify-self: start; }
  .passport { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 640px) {
  .passport__block { padding: 24px; }
}

/* =========================================================
   Прогресс-бар «тропа»
   ========================================================= */

.tp {
  --tp-line: var(--coal);
  position: fixed;
  z-index: 60;
  top: 50%;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transform: translateY(-50%);
}
.tp[data-theme="dark"] { --tp-line: var(--paper); }

.tp__mark {
  position: relative;
  display: block;
  width: 6px;
  height: 28px;
  padding: 0;
  border: 1.5px solid var(--tp-line);
  background: none;
  cursor: pointer;
  transition: border-color var(--dur);
}
.tp__mark::before { /* область нажатия больше самой метки */
  content: "";
  position: absolute;
  inset: -5px -12px;
}
.tp__mark:focus-visible { outline-width: 2px; }

.tp__fill {
  position: absolute;
  inset: -1.5px;
  background: var(--mark);
  transform-origin: 50% 0;
  transform: scaleY(var(--f, 0));
  transition: transform 120ms linear;
}

.tp__slash {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 3px;
  height: 46px;
  background: var(--tp-line);
  pointer-events: none;
  transform: translate(-50%, -50%) rotate(37deg) scaleY(0);
  transition: transform 400ms cubic-bezier(0.6, 0, 0.2, 1), background-color var(--dur);
}
.tp.is-finished .tp__slash { transform: translate(-50%, -50%) rotate(37deg) scaleY(1); }

@media (max-width: 767.98px) {
  .tp {
    top: 0;
    right: 0;
    left: 0;
    flex-direction: row;
    gap: 2px;
    transform: none;
  }
  .tp__mark {
    flex: 1;
    width: auto;
    height: 4px;
    border-width: 1px;
  }
  .tp__mark::before { inset: 0; }
  .tp__fill {
    inset: -1px;
    transform-origin: 0 50%;
    transform: scaleX(var(--f, 0));
  }
  .tp__slash { display: none; }
}

/* =========================================================
   Словарь туриста: термины и подсказки
   ========================================================= */

.term {
  display: inline;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  text-align: inherit;
  text-transform: inherit;
  text-decoration: underline dotted var(--mark) 2px;
  text-underline-offset: 4px;
  cursor: help;
}

.term-tip {
  position: fixed;
  z-index: 120;
  top: 0;
  left: 0;
  display: flex;
  gap: 12px;
  max-width: min(280px, calc(100vw - 16px));
  padding: 12px 16px;
  border-radius: var(--radius);
  background: var(--coal-bg);
  color: var(--paper);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.45;
  opacity: 0;
  pointer-events: none;
  transition: opacity 150ms ease;
}
.term-tip::before {
  content: "";
  flex: none;
  width: 4px;
  height: 14px;
  margin-top: 4px;
  background: var(--mark);
}
.term-tip.is-visible { opacity: 1; }

:root[data-mode="night"] .term-tip,
:root[data-mode="night"] .toast { border: 1px solid var(--line-light); }

/* ночью фон карточек совпадает с фоном секции — отделяем их тонкой рамкой */
:root[data-mode="night"] .layer,
:root[data-mode="night"] .passport__block,
:root[data-mode="night"] .pack__panel:not(.is-drop-target) { border: 1px solid var(--line-dark); }

/* =========================================================
   Свечение костра у нижнего края (только ночью) —
   единственное исключение из правила «без градиентов»
   ========================================================= */

body::after {
  content: "";
  position: fixed;
  z-index: 80;
  left: 50%;
  bottom: 0;
  width: 140vw;
  height: 60vh;
  background: radial-gradient(closest-side, rgba(232, 102, 58, 0.12), rgba(232, 102, 58, 0));
  filter: blur(40px);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 50%);
  transition: opacity 400ms ease;
}
:root[data-mode="night"] body::after { opacity: 1; }

/* =========================================================
   Тост
   ========================================================= */

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: calc(100% - 40px);
  padding: 16px 24px;
  border-radius: var(--radius);
  background: var(--coal-bg);
  color: var(--paper);
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 16px);
  transition: opacity var(--dur), transform var(--dur);
  --mark-h: 24px;
}
.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* =========================================================
   Печать чек-листа: только список, чек-боксы, логотип
   ========================================================= */

.print-sheet { display: none; }

@media print {
  @page { size: A4; margin: 16mm 18mm; }

  body.is-printing {
    background: #fff;
    color: #000;
    font-size: 11pt;
  }
  body.is-printing > *:not(.print-sheet) { display: none !important; }
  body::after,
  .tp,
  .term-tip { display: none !important; }
  body.is-printing .print-sheet { display: block; }

  .print-sheet__logo { width: 42mm; height: auto; margin-bottom: 10mm; }
  .print-sheet h1 { font-size: 22pt; margin-bottom: 3mm; }
  .print-sheet__summary { margin-bottom: 8mm; font-size: 11pt; }

  .print-group { margin-bottom: 7mm; break-inside: avoid; }
  .print-group h2 {
    margin-bottom: 2mm;
    padding-bottom: 2mm;
    border-bottom: 1pt solid #000;
    font-size: 13pt;
  }

  .print-list { padding: 0; list-style: none; }
  .print-list li {
    display: flex;
    align-items: center;
    gap: 3mm;
    padding: 1.6mm 0;
  }
  .print-check {
    flex: none;
    width: 4.2mm;
    height: 4.2mm;
    border: 1pt solid #000;
  }
}

</style>

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (value) => String(value).replace(/[&<>"']/g, (c) => ESC[c]);
  const fill = (tpl, data) => tpl.replace(/\{(\w+)\}/g, (_, key) => (key in data ? data[key] : ''));

  const formatNum = (n, digits = 0) => n.toLocaleString('ru-RU', { minimumFractionDigits: digits, maximumFractionDigits: digits || 1 });
  const clamp = (v, min, max) => Math.min(Math.max(v, min), max);
  const productById = (id) => D.products.find((p) => p.id === id);

  function plural(n, forms) {
    const n10 = n % 10;
    const n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return forms[0];
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return forms[1];
    return forms[2];
  }

  function readStore(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function writeStore(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      // без хранилища всё работает до перезагрузки страницы
    }
  }

  /* =========================================================
     Ночной режим «у костра»
     Режим ставится ещё в <head>, здесь — переключатель и запоминание.
     ========================================================= */

  function initMode() {
    const root = document.documentElement;
    const button = $('[data-mode-toggle]');
    let animTimer;

    const apply = (mode, animate) => {
      if (animate && !reducedMotion.matches) {
        root.classList.add('mode-anim');
        clearTimeout(animTimer);
        animTimer = setTimeout(() => root.classList.remove('mode-anim'), 450);
      }
      root.dataset.mode = mode;
      if (button) button.setAttribute('aria-pressed', String(mode === 'night'));
    };

    apply(root.dataset.mode === 'night' ? 'night' : 'day', false);
    if (!button) return;

    button.addEventListener('click', () => {
      const next = root.dataset.mode === 'night' ? 'day' : 'night';
      apply(next, true);
      try {
        localStorage.setItem('blaze-mode', next);
      } catch (e) {
        // выбор не запомнится, но режим переключится
      }
    });
  }

  /* =========================================================
     Метки «рисуются» краской
     Полосы каждой метки становятся отдельными элементами и проявляются
     снизу вверх, когда метка попадает в экран.
     ========================================================= */

  const MARK_BARS = {
    'mark-start': ['s1', 'm', 's2'],
    'mark-straight': ['m'],
    'mark-right': ['b', 't'],
    'mark-left': ['b', 't'],
  };

  function initMarks() {
    const canPaint = document.documentElement.classList.contains('paint-ready');

    // один SVG-фильтр на страницу: неровный край «краски по коре»
    document.body.insertAdjacentHTML('afterbegin', `
      <svg class="paint-filter" width="0" height="0" aria-hidden="true" focusable="false">
        <filter id="paint" x="-60%" y="-6%" width="220%" height="112%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </svg>`);

    const io = canPaint
      ? new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-painted');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.4 })
      : null;

    function hydrate(mark) {
      if (mark.classList.contains('is-hydrated')) return;
      const type = Object.keys(MARK_BARS).find((cls) => mark.classList.contains(cls));
      if (!type) return;
      const slash = $('.mark__slash', mark);
      MARK_BARS[type].forEach((kind, i) => {
        const bar = document.createElement('i');
        bar.className = `mark__bar mark__bar--${kind}`;
        bar.style.setProperty('--i', i);
        mark.insertBefore(bar, slash);
      });
      if (slash) slash.style.setProperty('--i', MARK_BARS[type].length);
      mark.classList.add('is-hydrated');
      if (io) io.observe(mark);
      else mark.classList.add('is-painted');
    }

    $$('.mark').forEach(hydrate);

    // метки, которые появятся позже (шаги конструктора, корзина и т. д.)
    new MutationObserver((records) => {
      records.forEach((record) => {
        record.addedNodes.forEach((node) => {
          if (node.nodeType !== 1) return;
          if (node.classList.contains('mark')) hydrate(node);
          node.querySelectorAll('.mark').forEach(hydrate);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  /* =========================================================
     Прогресс-бар «тропа»: 12 меток справа (или полоса сверху на телефоне)
     ========================================================= */

  function initTrailProgress() {
    const sections = $$('[data-theme]');
    if (!sections.length) return;

    const COUNT = 12;
    const nav = document.createElement('nav');
    nav.className = 'tp';
    nav.setAttribute('aria-label', 'прогресс прокрутки страницы');
    nav.dataset.theme = 'light';
    nav.innerHTML = Array.from({ length: COUNT }, (_, i) => `
      <button type="button" class="tp__mark" data-tp="${i}" aria-label="к ${Math.round((i / (COUNT - 1)) * 100)} % страницы">
        <span class="tp__fill"></span>${i === COUNT - 1 ? '<span class="tp__slash"></span>' : ''}
      </button>`).join('');
    document.body.appendChild(nav);

    const fills = $$('.tp__fill', nav);
    const footer = $('.footer');
    const mobile = window.matchMedia('(max-width: 767.98px)');
    let ticking = false;
    let footerVisible = false;

    const maxScroll = () => Math.max(document.documentElement.scrollHeight - window.innerHeight, 0);

    function update() {
      ticking = false;
      const max = maxScroll();
      const progress = max > 0 ? clamp(window.scrollY / max, 0, 1) : 1;
      fills.forEach((f, i) => f.style.setProperty('--f', clamp(progress * COUNT - i, 0, 1).toFixed(3)));
      nav.classList.toggle('is-finished', footerVisible || progress > 0.995);
    }

    const requestUpdate = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    };

    window.addEventListener('scroll', requestUpdate, { passive: true });
    window.addEventListener('resize', requestUpdate);
    // высота страницы меняется (шаги конструктора, картинки) — пересчитываем
    if ('ResizeObserver' in window) new ResizeObserver(requestUpdate).observe(document.body);

    nav.addEventListener('click', (e) => {
      const mark = e.target.closest('[data-tp]');
      if (!mark) return;
      window.scrollTo({
        top: maxScroll() * (Number(mark.dataset.tp) / (COUNT - 1)),
        behavior: reducedMotion.matches ? 'auto' : 'smooth',
      });
    });

    if (footer) {
      new IntersectionObserver(([entry]) => {
        footerVisible = entry.isIntersecting;
        update();
      }).observe(footer);
    }

    // цвет контура — по секции под рядом меток (на телефоне — под полосой сверху)
    let themeObserver;
    function watchThemes() {
      if (themeObserver) themeObserver.disconnect();
      const visible = new Map();
      themeObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => visible.set(entry.target, entry.isIntersecting));
        const active = sections.find((s) => s.matches('.header') && visible.get(s))
          || sections.find((s) => visible.get(s));
        if (active) nav.dataset.theme = active.dataset.theme;
      }, { rootMargin: mobile.matches ? '0px 0px -99% 0px' : '-50% 0px -49% 0px' });
      sections.forEach((s) => themeObserver.observe(s));
    }

    watchThemes();
    mobile.addEventListener('change', watchThemes);
    update();
  }

  /* =========================================================
     Словарь туриста: термины в тексте становятся кнопками с подсказкой
     ========================================================= */

  const GLOSSARY = D.glossary.map((entry, i) => ({
    ...entry,
    id: `gloss-def-${i}`,
    // слово целиком: перед основой не должно быть буквы, окончание любое
    re: new RegExp(`(^|[^а-яёa-z])((?:${entry.stem})[а-яё]*)`, 'iu'),
  }));

  let tooltip = null;

  function ensureGlossaryDefs() {
    if ($('#glossary-defs')) return;
    const defs = document.createElement('div');
    defs.id = 'glossary-defs';
    defs.hidden = true;
    defs.innerHTML = GLOSSARY.map((g) => `<span id="${g.id}">${esc(g.definition)}</span>`).join('');
    document.body.appendChild(defs);
  }

  function applyGlossary(element) {
    if (!element || !GLOSSARY.length) return;
    ensureGlossaryDefs();

    const used = new Set($$('.term', element).map((t) => t.dataset.term));
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent = node.parentElement;
        if (!parent || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        if (parent.closest('a, button, label, input, textarea, script, style, h1, h2, .term, [data-no-glossary]')) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      },
    });

    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach((node) => {
      const text = node.nodeValue;
      const hits = [];
      GLOSSARY.forEach((g, index) => {
        if (used.has(String(index))) return;
        const m = g.re.exec(text);
        if (!m) return;
        const start = m.index + m[1].length;
        hits.push({ index, start, end: start + m[2].length });
      });
      if (!hits.length) return;

      hits.sort((a, b) => a.start - b.start);
      const frag = document.createDocumentFragment();
      let cursor = 0;
      hits.forEach((hit) => {
        if (hit.start < cursor) return; // пересекается с уже найденным термином
        used.add(String(hit.index));
        frag.append(text.slice(cursor, hit.start));
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'term';
        button.dataset.term = String(hit.index);
        button.setAttribute('aria-describedby', GLOSSARY[hit.index].id);
        button.textContent = text.slice(hit.start, hit.end);
        frag.append(button);
        cursor = hit.end;
      });
      frag.append(text.slice(cursor));
      node.replaceWith(frag);
    });
  }

  function initGlossaryTooltip() {
    tooltip = document.createElement('div');
    tooltip.className = 'term-tip';
    tooltip.id = 'term-tip';
    tooltip.setAttribute('role', 'tooltip');
    tooltip.hidden = true;
    document.body.appendChild(tooltip);

    const header = $('.header');
    let current = null;
    let pinned = false;

    function place() {
      if (!current) return;
      const r = current.getBoundingClientRect();
      const gap = 10;
      const w = tooltip.offsetWidth;
      const h = tooltip.offsetHeight;
      const topLimit = (header ? header.getBoundingClientRect().bottom : 0) + 8;
      let top = r.top - h - gap;
      let side = 'top';
      if (top < topLimit) {
        top = r.bottom + gap;
        side = 'bottom';
      }
      const left = clamp(r.left + r.width / 2 - w / 2, 8, window.innerWidth - w - 8);
      tooltip.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`;
      tooltip.dataset.side = side;
    }

    function show(term) {
      const entry = GLOSSARY[Number(term.dataset.term)];
      if (!entry) return;
      current = term;
      tooltip.textContent = entry.definition;
      tooltip.hidden = false;
      place();
      tooltip.classList.add('is-visible');
    }

    function hide() {
      current = null;
      pinned = false;
      tooltip.classList.remove('is-visible');
      tooltip.hidden = true;
    }

    document.addEventListener('mouseover', (e) => {
      const term = e.target.closest('.term');
      if (term && !pinned && term !== current) show(term);
    });
    document.addEventListener('mouseout', (e) => {
      const term = e.target.closest('.term');
      if (term && !pinned && term === current && !term.contains(e.relatedTarget)) hide();
    });
    document.addEventListener('focusin', (e) => {
      const term = e.target.closest('.term');
      if (term) show(term);
      else if (current) hide();
    });
    document.addEventListener('click', (e) => {
      const term = e.target.closest('.term');
      if (term) {
        if (pinned && current === term) hide();
        else {
          show(term);
          pinned = true;
        }
        return;
      }
      if (current) hide();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && current) hide();
    });
    window.addEventListener('scroll', () => { if (current) place(); }, { passive: true });
    window.addEventListener('resize', () => { if (current) place(); });
  }

  /* =========================================================
     Корзина: хранится в localStorage этого браузера
     ========================================================= */

  function loadCart() {
    const data = readStore(CART.storageKey, []);
    if (!Array.isArray(data)) return [];
    return data.filter((i) => i && typeof i.id === 'string' && (
      (i.type === 'kit' && typeof i.title === 'string' && Array.isArray(i.items)) ||
      (i.type === 'product' && typeof i.name === 'string' && Number.isFinite(i.price) &&
        Number.isInteger(i.qty) && i.qty > 0)
    ));
  }

  function createCart() {
    const T = CART.text;
    const root = $('#cart');
    const overlay = $('.cart-overlay');
    const body = $('#cart-body');
    const foot = $('#cart-foot');
    const title = $('#cart-title');
    const opener = $('[data-cart-open]');
    const counters = $$('[data-cart-count]');
    if (!root || !body || !foot) return { addKit() {}, addProduct() {} };

    let items = loadCart();
    let lastFocus = null;
    let hideTimer;

    const count = () => items.reduce((sum, i) => sum + (i.type === 'product' ? i.qty : 1), 0);
    const total = () => items.reduce((sum, i) => sum + (i.type === 'product' ? i.price * i.qty : 0), 0);

    function kitHTML(item) {
      return `
        <li class="cart-item">
          <p class="cart-item__type">${esc(T.kitType)}</p>
          <h3 class="cart-item__name">${esc(item.title)}</h3>
          <details class="cart-item__details">
            <summary>${esc(T.contents)}: ${item.items.length} ${esc(plural(item.items.length, T.things))}</summary>
            <ul class="bullets">${item.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
          </details>
          <button type="button" class="link-btn cart-item__remove" data-remove="${esc(item.id)}">${esc(T.remove)}</button>
        </li>`;
    }

    function productHTML(item) {
      return `
        <li class="cart-item">
          <p class="cart-item__type">${esc(T.productType)}</p>
          <h3 class="cart-item__name">${esc(item.name)}</h3>
          <div class="cart-item__row">
            <div class="qty" role="group" aria-label="количество">
              <button type="button" class="qty__btn" data-qty="-1" data-id="${esc(item.id)}" aria-label="${esc(T.decrease)}">−</button>
              <span class="qty__value" aria-live="polite">${item.qty}</span>
              <button type="button" class="qty__btn" data-qty="1" data-id="${esc(item.id)}" aria-label="${esc(T.increase)}">+</button>
            </div>
            <p class="cart-item__price">${esc(formatPrice(item.price * item.qty))}</p>
          </div>
          <button type="button" class="link-btn cart-item__remove" data-remove="${esc(item.id)}">${esc(T.remove)}</button>
        </li>`;
    }

    function render() {
      const n = count();
      counters.forEach((c) => {
        c.textContent = String(n);
        c.classList.toggle('has-items', n > 0);
      });
      if (opener) opener.setAttribute('aria-label', `корзина: ${n}`);

      if (!items.length) {
        body.innerHTML = `
          <div class="cart-empty">
            <span class="mark mark-straight" aria-hidden="true"></span>
            <p class="cart-empty__title">${esc(T.emptyTitle)}</p>
            <p>${esc(T.emptyText)}</p>
            <a class="btn btn--primary" href="${HOME}#builder" data-cart-close>${esc(T.emptyCta)}</a>
          </div>`;
        foot.hidden = true;
        foot.innerHTML = '';
        return;
      }

      body.innerHTML = `<ul class="cart-list">${items.map((i) => (i.type === 'kit' ? kitHTML(i) : productHTML(i))).join('')}</ul>`;
      const hasKits = items.some((i) => i.type === 'kit');
      foot.hidden = false;
      foot.innerHTML = `
        <div class="cart-total"><span>${esc(T.total)}</span><span>${esc(formatPrice(total()))}</span></div>
        ${hasKits ? `<p class="cart-note">${esc(T.kitsNote)}</p>` : ''}
        <button type="button" class="btn btn--primary" data-cart-checkout>${esc(T.checkout)}</button>
        <button type="button" class="link-btn cart-clear" data-cart-clear>${esc(T.clear)}</button>`;
    }

    function update() {
      writeStore(CART.storageKey, items);
      render();
    }

    function open() {
      if (!root.hidden && document.body.classList.contains('cart-open')) return;
      clearTimeout(hideTimer);
      if (document.body.classList.contains('menu-open')) $('.burger').click();
      lastFocus = document.activeElement;
      root.hidden = false;
      overlay.hidden = false;
      void root.offsetWidth; // стартовое положение для анимации
      document.body.classList.add('cart-open');
      if (opener) opener.setAttribute('aria-expanded', 'true');
      $('.cart__close', root).focus();
    }

    function close() {
      if (!document.body.classList.contains('cart-open')) return;
      document.body.classList.remove('cart-open');
      if (opener) opener.setAttribute('aria-expanded', 'false');
      hideTimer = setTimeout(() => {
        root.hidden = true;
        overlay.hidden = true;
      }, reducedMotion.matches ? 0 : DURATION);
      if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
    }

    function addKit(kit) {
      const id = `kit:${kit.summary.join('|')}`;
      if (items.some((i) => i.id === id)) {
        showToast(T.kitExists);
        return;
      }
      items.push({
        id,
        type: 'kit',
        title: kit.summary.join(' · '),
        items: [...kit.layers, ...kit.gear].flatMap((group) => group.items),
      });
      update();
      showToast(RULES.text.toast);
    }

    function addProduct(product) {
      const id = `product:${product.id}`;
      const existing = items.find((i) => i.id === id);
      if (existing) existing.qty += 1;
      else items.push({ id, type: 'product', name: product.name, price: product.price, qty: 1 });
      update();
      showToast(fill(T.productAdded, { name: product.name }));
    }

    function removeItem(id) {
      items = items.filter((i) => i.id !== id);
      update();
      title.focus();
    }

    function changeQty(id, delta) {
      const item = items.find((i) => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty < 1) {
        removeItem(id);
        return;
      }
      update();
      const same = $(`.qty__btn[data-id="${CSS.escape(id)}"][data-qty="${delta}"]`, body);
      if (same) same.focus();
    }

    if (opener) opener.addEventListener('click', open);
    overlay.addEventListener('click', close);

    root.addEventListener('click', (e) => {
      const target = e.target.closest('[data-cart-close], [data-remove], [data-qty], [data-cart-clear], [data-cart-checkout]');
      if (!target) return;
      if (target.matches('[data-cart-close]')) close();
      else if (target.matches('[data-remove]')) removeItem(target.dataset.remove);
      else if (target.matches('[data-qty]')) changeQty(target.dataset.id, Number(target.dataset.qty));
      else if (target.matches('[data-cart-clear]')) {
        if (window.confirm(T.clearConfirm)) {
          items = [];
          update();
          title.focus();
        }
      } else if (target.matches('[data-cart-checkout]')) showToast(T.checkoutToast);
    });

    // Esc закрывает, Tab не выходит за пределы панели
    root.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        close();
        return;
      }
      if (e.key !== 'Tab') return;
      const focusables = $$('a[href], button:not([disabled]), summary', root)
        .filter((el) => el.offsetParent !== null);
      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === title)) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    // «в корзину» у товара — на любой странице
    document.addEventListener('click', (e) => {
      const button = e.target.closest('[data-add-product]');
      if (!button) return;
      const product = productById(button.dataset.addProduct);
      if (product) addProduct(product);
    });

    render();
    return { addKit, addProduct };
  }

     Каталог: карточки из data.js, каждая ведёт на паспорт вещи

  function renderCatalog() {
