  <script>
    /* режим «день / ночь» и анимация меток ставятся до отрисовки, чтобы ничего не мигало */
    (function () {
      var d = document.documentElement, m = null;
      try { m = localStorage.getItem('blaze-mode'); } catch (e) {}
      if (m !== 'night' && m !== 'day') { var h = new Date().getHours(); m = h >= 21 || h < 6 ? 'night' : 'day'; }
      d.setAttribute('data-mode', m);
      if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('paint-ready');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
